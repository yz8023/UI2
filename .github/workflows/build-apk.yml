name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'android-src/**'
      - 'app/**'
      - 'library/**'
      - 'motion-demos/**'
      - 'glass-demos/**'
      - 'video-demos/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK（build-tools 34 + platform 34）
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk
          cd /usr/local/lib/android/sdk
          sudo curl -sSL -o bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          sudo unzip -qo bt.zip && sudo mv android-14 build-tools-34
          sudo mkdir -p platforms && cd platforms
          sudo curl -sSL -o p.zip https://dl.google.com/android/repository/platform-34-ext12_r01.zip
          sudo unzip -qo p.zip && sudo mv android-34-ext12 android-34
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: 重建 HTML（Python 生成器 → 单文件页面）
        run: |
          python3 app/_build.py
          python3 _portal.py
          cd library && python3 gen_library.py && cd ..
          cd motion-demos && python3 _make.py && cd ..
          cd glass-demos && python3 _glass_make.py && cd ..
          cd video-demos && python3 _make_pages.py && cd ..

      - name: 打包 APK
        run: |
          export SDK=/usr/local/lib/android/sdk
          export BT=$SDK/build-tools-34
          # build.sh 里的默认路径按本地沙箱写死了，这里用环境变量覆盖
          sed -i "s|^SDK=.*|SDK=$SDK|; s|^BT=.*|BT=$BT|; s|^JAVA_HOME=.*|JAVA_HOME=$JAVA_HOME|" android-src/build.sh
          bash android-src/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: uikit-library-apk
          path: apk/*.apk
